name: Hyht

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  HyhtCore:
    path: Packages/HyhtCore

targets:
  Hyht:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masatora.hyht
        CODE_SIGN_ENTITLEMENTS: App/Hyht.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hyht
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - hyht
            CFBundleTypeRole: Editor
        UILaunchScreen: {}
    dependencies:
      - package: HyhtCore
      - target: HyhtWidget
        embed: true

  HyhtWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masatora.hyht.widget
        CODE_SIGN_ENTITLEMENTS: Widget/HyhtWidget.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: HyhtWidget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: HyhtCore

schemes:
  Hyht:
    build:
      targets:
        Hyht: all
        HyhtWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - target:
            package: HyhtCore/HyhtCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
